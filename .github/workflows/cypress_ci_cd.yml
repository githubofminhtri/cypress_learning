name: E2E (Cypress)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  e2e:
    # run Chrome & Firefox on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: |
          npm ci
          npm i -D mochawesome mochawesome-merge mochawesome-report-generator

      - name: Prepare report directory
        run: |
          mkdir -p cypress/reports/${{ matrix.browser }}
          chmod -R 777 cypress/reports

      # Run Cypress (auto-installs browsers/xvfb on ubuntu)
      - name: Cypress run on ${{ matrix.browser }}
        id: cypress
        env:
          MOCHA_DIR: cypress/reports/${{ matrix.browser }}
        uses: cypress-io/github-action@v6
        with:
          command: >
            npx cypress run
            --spec cypress/e2e/excercise/first_case.cy.js
            --browser ${{ matrix.browser }}
            --headless
       
      - name: Show what reports exist
        run: |
          echo "== PWD ==" && pwd
          echo "== Tree cypress/reports =="
          ls -R cypress || true
          ls -R cypress/reports || true

      - name: Upload screenshots (on failure)
        if: failure() && steps.cypress.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload mochawesome json
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-json-${{ matrix.browser }}
          path: cypress/reports/${{ matrix.browser }}/**/*.json
          if-no-files-found: error

# Merge + HTML (runs once after all browsers finish)
  merge-and-report:
    runs-on: ubuntu-latest
    needs: [e2e] # add e2e-windows-edge here if you enable Edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install reporter deps
        run: |
          npm i -D mochawesome mochawesome-merge mochawesome-report-generator

      - name: Download all mochawesome json artifacts
        uses: actions/download-artifact@v4
        with:
          path: mochawesome-json

      - name: Show downloaded structure (debug)
        run: |
          ls -R mochawesome-json || true

      - name: Merge mochawesome JSON
        run: |
          mkdir -p cypress/reports
          npx mochawesome-merge "mochawesome-json/**/*.json" > cypress/reports/merged.json

      - name: Generate HTML report
        run: |
          npx marge cypress/reports/merged.json -f index -o cypress/reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report
          path: |
            cypress/reports/index.html
            cypress/reports/assets
          if-no-files-found: error